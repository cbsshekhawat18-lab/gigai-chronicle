# Workspace layout per ARCHITECTURE.md §12.
packages:
  - "packages/*"
  - "packages/providers/*"
  - "apps/*"

# Single source of truth for shared toolchain versions (pnpm catalogs).
catalog:
  "@types/node": "^20.14.0"
  typescript: "^5.6.0"
  vitest: "^3.0.0"
  fast-check: "^4.0.0"
  zod: "^4.0.0"
  better-sqlite3: "^12.0.0"
  "@types/better-sqlite3": "^7.6.0"
  commander: "^14.0.0"
  esbuild: "^0.25.0"

# pnpm 10 blocks dependency build scripts by default; esbuild (vitest's
# transform engine) is the only approved one. Additions require review.
onlyBuiltDependencies:
  - esbuild
  - better-sqlite3
